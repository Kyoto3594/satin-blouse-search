<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>サテンブラウス画像検索 v4</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{font-size:23px;margin:0 0 6px}.ver{display:inline-block;background:#111;color:#fff;padding:4px 9px;border-radius:8px;font-size:13px;font-weight:700}.muted{font-size:13px;color:#666;line-height:1.5}button{font-size:16px;border:0;border-radius:12px;padding:12px 16px;background:#007aff;color:#fff;margin:5px 4px 5px 0}button:disabled{opacity:.45}.secondary{background:#e9e9ed;color:#111}input[type=file]{width:100%;font-size:16px}input[type=range]{width:100%}#status{white-space:pre-wrap;line-height:1.55}.err{color:#b42318}.ok{color:#16803c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#fafafa;border-radius:12px;overflow:hidden}.item img{width:100%;aspect-ratio:1;object-fit:cover}.item p{margin:7px;font-size:13px}progress{width:100%;height:14px}</style></head><body><main><h1>サテンブラウス画像検索 <span class="ver">v4</span></h1><p class="muted">iPhone Safari専用テスト版。AIはiPhoneのCPU(WASM)で実行します。写真は端末外へ送信しません。</p><div class="card"><b>① 写真を選択</b><input id="files" type="file" accept="image/*" multiple><p class="muted">最初は1枚だけ選択してください。</p></div><div class="card"><b>② 判定条件</b><p>サテンらしさ：<b id="tv">20%</b>以上</p><input id="th" type="range" min="10" max="80" value="20"><button id="run">解析する</button><button id="clear" class="secondary">クリア</button></div><div class="card"><b>③ 解析状況</b><div id="status">v4：まだ解析していません。</div><progress id="pg" value="0" max="100"></progress></div><div class="card"><b>④ 結果</b><div id="res" class="grid"></div></div></main><script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
env.allowLocalModels=false; env.useBrowserCache=true;
const MODEL='Xenova/mobileclip_s0';
const LABELS=['a person wearing a satin blouse','a person wearing a non-satin blouse','a person not wearing a blouse'];
const $=id=>document.getElementById(id); let pipe=null, files=[];
$('th').oninput=()=>$('tv').textContent=$('th').value+'%';
$('files').onchange=e=>{files=[...e.target.files];$('res').innerHTML='';$('pg').value=0;$('status').textContent=`v4：${files.length}枚選択しました。`};
function status(s,c=''){ $('status').textContent=s; $('status').className=c; }
async function getPipe(){if(pipe)return pipe;status('v4：AIモデルを読み込んでいます。\nCPU互換モードで起動します。初回は時間がかかります。'); pipe=await pipeline('zero-shot-image-classification',MODEL,{device:'wasm',dtype:'q8'}); return pipe;}
async function small(file){const b=await createImageBitmap(file);const m=640,sc=Math.min(1,m/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*sc));c.height=Math.max(1,Math.round(b.height*sc));c.getContext('2d',{alpha:false}).drawImage(b,0,0,c.width,c.height);b.close();return new Promise(r=>c.toBlob(r,'image/jpeg',.8));}
$('run').onclick=async()=>{if(!files.length){alert('写真を1枚選択してください。');return} $('run').disabled=true;$('clear').disabled=true;$('res').innerHTML='';$('pg').value=0;try{const p=await getPipe();const all=[];for(let i=0;i<files.length;i++){status(`v4：画像 ${i+1}/${files.length} を解析中…`);const blob=await small(files[i]);const url=URL.createObjectURL(blob);try{const r=await p(url,{candidate_labels:LABELS});all.push({file:files[i],score:r.find(x=>x.label===LABELS[0])?.score||0})}finally{URL.revokeObjectURL(url)}$('pg').value=(i+1)/files.length*100;await new Promise(r=>setTimeout(r,50))}all.sort((a,b)=>b.score-a.score);const th=+$('th').value/100;const hits=all.filter(x=>x.score>=th);status(`v4：解析完了。${all.length}枚中 ${hits.length}枚が候補です。`,'ok');if(!hits.length){$('res').innerHTML='<p class="muted">候補なし。閾値を下げて再解析してください。</p>'}for(const x of hits){const d=document.createElement('div');d.className='item';const u=URL.createObjectURL(x.file);d.innerHTML=`<img src="${u}"><p><b>${Math.round(x.score*100)}%</b><br>${x.file.name}</p>`;$('res').appendChild(d)}}catch(e){console.error(e);pipe=null;status('v4：AIモデルの起動に失敗しました。\n\n'+(e?.message||String(e)),'err')}finally{$('run').disabled=false;$('clear').disabled=false}};
$('clear').onclick=()=>{files=[];$('files').value='';$('res').innerHTML='';$('pg').value=0;status('v4：クリアしました。')};
</script></main></body></html>
