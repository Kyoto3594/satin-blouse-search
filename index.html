<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>サテンブラウス画像検索</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{margin:0;background:#f5f5f7;color:#1d1d1f}
main{max-width:760px;margin:auto;padding:18px}
.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
h1{font-size:24px;margin:5px 0 8px}.muted{color:#666;font-size:14px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#007aff;color:white}
button.secondary{background:#e9e9ed;color:#222}
input[type=file]{width:100%;font-size:16px}
input[type=range]{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:#fafafa;border-radius:12px;overflow:hidden}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover}
.item p{margin:7px 9px;font-size:13px}
.score{font-weight:700}
#status{white-space:pre-wrap}
progress{width:100%;height:14px}
</style>
</head>
<body>
<main>
<h1>サテンブラウス画像検索</h1>
<p class="muted">Safariだけで動作。選択した写真を端末内で解析します。</p>

<div class="card">
  <h2>① 写真を選択</h2>
  <input id="files" type="file" accept="image/*" multiple>
  <p class="muted">iPhoneの「写真」から複数枚選択できます。</p>
</div>

<div class="card">
  <h2>② 判定条件</h2>
  <label>サテンブラウスらしさの閾値：<b id="thresholdText">55%</b></label>
  <input id="threshold" type="range" min="35" max="80" value="55">
  <p class="muted">低くすると候補が増え、高くすると絞り込まれます。</p>
  <button id="run">解析する</button>
  <button id="clear" class="secondary">クリア</button>
</div>

<div class="card">
  <h2>③ 解析状況</h2>
  <div id="status">まだ解析していません。</div>
  <progress id="progress" value="0" max="100"></progress>
</div>

<div class="card">
  <h2>④ 結果</h2>
  <div id="results" class="grid"></div>
</div>
</main>

<script type="module">
import { pipeline, env } from
'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';

env.allowLocalModels = false;
env.useBrowserCache = true;

const filesEl=document.querySelector('#files');
const runBtn=document.querySelector('#run');
const clearBtn=document.querySelector('#clear');
const statusEl=document.querySelector('#status');
const progressEl=document.querySelector('#progress');
const resultsEl=document.querySelector('#results');
const thresholdEl=document.querySelector('#threshold');
const thresholdText=document.querySelector('#thresholdText');

thresholdEl.oninput=()=>thresholdText.textContent=thresholdEl.value+'%';

let files=[];
let classifier=null;

async function getClassifier(){
  if(classifier) return classifier;
  statusEl.textContent='AIモデルを読み込んでいます。初回だけ時間がかかる場合があります。';
  classifier=await pipeline(
    'zero-shot-image-classification',
    'Xenova/clip-vit-base-patch32',
    {device:'webgpu'}
  ).catch(async()=>{
    statusEl.textContent='WebGPUが使えないため、通常のブラウザ処理に切り替えています。';
    return await pipeline(
      'zero-shot-image-classification',
      'Xenova/clip-vit-base-patch32'
    );
  });
  return classifier;
}

filesEl.onchange=()=>{files=[...filesEl.files];statusEl.textContent=files.length+'枚選択しました。';};

runBtn.onclick=async()=>{
  if(!files.length){alert('まず写真を選択してください。');return;}
  runBtn.disabled=true; resultsEl.innerHTML=''; progressEl.value=0;
  try{
    const pipe=await getClassifier();
    const labels=[
      'a person wearing a satin blouse',
      'a person wearing a shiny satin shirt or blouse',
      'a person wearing a regular cotton blouse',
      'a person not wearing a blouse'
    ];
    const out=[];
    for(let i=0;i<files.length;i++){
      statusEl.textContent=`画像 ${i+1}/${files.length} を解析中…`;
      const url=URL.createObjectURL(files[i]);
      const r=await pipe(url,{candidate_labels:labels});
      URL.revokeObjectURL(url);
      const sat=r.find(x=>x.label===labels[0])?.score||0;
      const shiny=r.find(x=>x.label===labels[1])?.score||0;
      const regular=r.find(x=>x.label===labels[2])?.score||0;
      const score=Math.min(1,Math.max(sat,shiny)*0.7 + (1-regular)*0.3);
      out.push({file:files[i],score});
      progressEl.value=(i+1)/files.length*100;
    }
    out.sort((a,b)=>b.score-a.score);
    const th=Number(thresholdEl.value)/100;
    const filtered=out.filter(x=>x.score>=th);
    statusEl.textContent=`解析完了：${filtered.length}枚を候補として表示しました。`;
    for(const x of filtered){
      const url=URL.createObjectURL(x.file);
      const div=document.createElement('div'); div.className='item';
      div.innerHTML=`<img src="${url}"><p><span class="score">${Math.round(x.score*100)}%</span><br>${escapeHtml(x.file.name)}</p>`;
      resultsEl.appendChild(div);
    }
  }catch(e){
    console.error(e);
    statusEl.textContent='解析に失敗しました。Safariを最新版にして、通信状態を確認してください。\\n'+e;
  }finally{runBtn.disabled=false;}
};

clearBtn.onclick=()=>{files=[];filesEl.value='';resultsEl.innerHTML='';progressEl.value=0;statusEl.textContent='クリアしました。';};

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
